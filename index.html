<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MG AI</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f4f6f8;
      color:#111;
    }
    .app{
      max-width:600px;
      margin:auto;
      min-height:100vh;
      background:white;
      display:flex;
      flex-direction:column;
    }
    header{
      padding:18px;
      background:#2563eb;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    header h1{margin:0;font-size:24px}
    #chat{
      flex:1;
      padding:20px;
      overflow:auto;
    }
    .msg{
      padding:12px 15px;
      margin:10px 0;
      border-radius:15px;
      max-width:85%;
      line-height:1.5;
    }
    .ai{background:#eef2ff}
    .user{
      background:#2563eb;
      color:white;
      margin-left:auto;
    }
    .bottom{
      display:flex;
      gap:8px;
      padding:12px;
      border-top:1px solid #ddd;
    }
    input{
      flex:1;
      padding:14px;
      border:1px solid #bbb;
      border-radius:25px;
      font-size:16px;
    }
    button{
      border:0;
      border-radius:50%;
      width:50px;
      height:50px;
      background:#2563eb;
      color:white;
      font-size:20px;
    }
  </style>
</head>

<body>
<div class="app">

<header>
  <h1>🤖 MG AI</h1>
  <span>आपका स्मार्ट सहायक</span>
</header>

<main id="chat">
  <div class="msg ai">
    नमस्ते! 👋 मैं MG AI हूँ।<br>
    आप मुझसे कुछ भी पूछ सकते हैं।
  </div>
</main>

<div class="bottom">
  <input id="question" placeholder="अपना सवाल लिखें...">
  <button onclick="ask()">➤</button>
</div>

</div>

<script>
function ask(){
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const q = input.value.trim();

  if(!q) return;

  chat.innerHTML += `<div class="msg user">${q}</div>`;

  let answer = "आपका सवाल मिल गया। 😊 MG AI अभी तैयार किया जा रहा है।";

  if(q.toLowerCase().includes("hello") || q.includes("नमस्ते")){
    answer = "नमस्ते! 👋 मैं MG AI हूँ। आपकी कैसे मदद करूँ?";
  }

  if(q.includes("नाम")){
    answer = "मेरा नाम MG AI है। 🤖";
  }

  chat.innerHTML += `<div class="msg ai">${answer}</div>`;

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
